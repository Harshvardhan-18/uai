{{- $secretObj := (lookup "v1" "Secret" .Release.Namespace (printf "%s-mariadb" .Release.Name)) | default dict }}
{{- $secretData := (get $secretObj "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  database: {{ .Values.auth.database | default "wordpress" | b64enc | quote }}
  username: {{ .Values.auth.username | default "wp_user" | b64enc | quote }}
  {{- if .Values.auth.password }}
  password: {{ .Values.auth.password | b64enc | quote }}
  {{- else if hasKey $secretData "password" }}
  password: {{ index $secretData "password" | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.rootPassword }}
  root-password: {{ .Values.auth.rootPassword | b64enc | quote }}
  {{- else if hasKey $secretData "root-password" }}
  root-password: {{ index $secretData "root-password" | quote }}
  {{- else }}
  root-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
