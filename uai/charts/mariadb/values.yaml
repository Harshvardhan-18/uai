enabled: true

image:
  repository: mariadb
  tag: "11.2"
  pullPolicy: IfNotPresent

auth:
  database: wordpress
  username: wp_user
  password: "REDACTED_MARIADB_PASS"
  rootPassword: "REDACTED_ROOT_PASS"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  size: 1Gi
  storageClass: ""
