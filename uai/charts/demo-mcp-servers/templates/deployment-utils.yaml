apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-utils-mcp
  labels:
    app.kubernetes.io/name: utils-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: utils-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: utils-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: utils-mcp
          image: "{{ .Values.utils.image.repository }}:{{ .Values.utils.image.tag }}"
          imagePullPolicy: {{ .Values.utils.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "{{ .Values.utils.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.utils.port }}
          resources:
            {{- toYaml .Values.utils.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.utils.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.utils.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
