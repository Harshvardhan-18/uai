apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-woo-credentials
  labels:
    app.kubernetes.io/name: woocommerce
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  url: "http://{{ .Release.Name }}-woocommerce.{{ .Release.Namespace }}.svc.cluster.local"
  store-url: {{ .Values.site.url | quote }}
  consumer-key: {{ .Values.credentials.consumerKey | quote }}
  consumer-secret: {{ .Values.credentials.consumerSecret | quote }}
