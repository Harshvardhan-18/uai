{{- $secretObj := (lookup "v1" "Secret" .Release.Namespace (printf "%s-woo-credentials" .Release.Name)) | default dict }}
{{- $secretData := (get $secretObj "data") | default dict }}
{{- $consumerKey := "" }}
{{- if .Values.credentials.consumerKey }}
  {{- $consumerKey = .Values.credentials.consumerKey }}
{{- else if hasKey $secretData "consumer-key" }}
  {{- $consumerKey = (index $secretData "consumer-key" | b64dec) }}
{{- else }}
  {{- $consumerKey = (printf "ck_%s" (randAlphaNum 40 | lower)) }}
{{- end }}
{{- $consumerSecret := "" }}
{{- if .Values.credentials.consumerSecret }}
  {{- $consumerSecret = .Values.credentials.consumerSecret }}
{{- else if hasKey $secretData "consumer-secret" }}
  {{- $consumerSecret = (index $secretData "consumer-secret" | b64dec) }}
{{- else }}
  {{- $consumerSecret = (printf "cs_%s" (randAlphaNum 40 | lower)) }}
{{- end }}
{{- $adminPassword := "" }}
{{- if .Values.site.adminPassword }}
  {{- $adminPassword = .Values.site.adminPassword }}
{{- else if hasKey $secretData "admin-password" }}
  {{- $adminPassword = (index $secretData "admin-password" | b64dec) }}
{{- else }}
  {{- $adminPassword = randAlphaNum 20 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-woo-credentials
  labels:
    app.kubernetes.io/name: woocommerce
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  url: {{ printf "http://%s-woocommerce.%s.svc.cluster.local" .Release.Name .Release.Namespace | b64enc | quote }}
  store-url: {{ .Values.site.url | default "http://store.localtest.me" | b64enc | quote }}
  consumer-key: {{ $consumerKey | b64enc | quote }}
  consumer-secret: {{ $consumerSecret | b64enc | quote }}
  admin-password: {{ $adminPassword | b64enc | quote }}
