enabled: true

image:
  repository: uai-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

env:
  encryptionKey: ""
  jwtSecret: ""
  adminEmail: "admin@localtest.me"
  adminPassword: ""
  inClusterAllowlist: ""
  healthCheckIntervalMs: 10000
  llmProvider: "auto"
  llmModel: ""
