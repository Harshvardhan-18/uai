apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  encryption-key: {{ .Values.env.encryptionKey | quote }}
  jwt-secret: {{ .Values.env.jwtSecret | quote }}
  admin-email: {{ .Values.env.adminEmail | quote }}
  admin-password: {{ .Values.env.adminPassword | quote }}
