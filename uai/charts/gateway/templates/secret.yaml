{{- $secretObj := (lookup "v1" "Secret" .Release.Namespace (printf "%s-gateway" .Release.Name)) | default dict }}
{{- $secretData := (get $secretObj "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if .Values.env.encryptionKey }}
  encryption-key: {{ .Values.env.encryptionKey | b64enc | quote }}
  {{- else if hasKey $secretData "encryption-key" }}
  encryption-key: {{ index $secretData "encryption-key" | quote }}
  {{- else }}
  encryption-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.env.jwtSecret }}
  jwt-secret: {{ .Values.env.jwtSecret | b64enc | quote }}
  {{- else if hasKey $secretData "jwt-secret" }}
  jwt-secret: {{ index $secretData "jwt-secret" | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  admin-email: {{ .Values.env.adminEmail | default "admin@localtest.me" | b64enc | quote }}
  {{- if .Values.env.adminPassword }}
  admin-password: {{ .Values.env.adminPassword | b64enc | quote }}
  {{- else if hasKey $secretData "admin-password" }}
  admin-password: {{ index $secretData "admin-password" | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
