apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: db-url
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gateway
                  key: encryption-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gateway
                  key: jwt-secret
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gateway
                  key: admin-email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gateway
                  key: admin-password
            {{- if .Values.env.llmProvider }}
            - name: LLM_PROVIDER
              value: {{ .Values.env.llmProvider | quote }}
            {{- end }}
            {{- if .Values.env.llmModel }}
            - name: LLM_MODEL
              value: {{ .Values.env.llmModel | quote }}
            {{- end }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: uai-llm
                  key: llm-api-key
                  optional: true
            {{- if .Values.env.healthCheckIntervalMs }}
            - name: HEALTH_CHECK_INTERVAL_MS
              value: {{ .Values.env.healthCheckIntervalMs | quote }}
            {{- end }}
            {{- if .Values.env.inClusterAllowlist }}
            - name: IN_CLUSTER_ALLOWLIST
              value: {{ .Values.env.inClusterAllowlist | quote }}
            {{- end }}
            - name: SITE_TIMEZONE
              value: {{ .Values.env.siteTimezone | default "Asia/Kolkata" | quote }}
            - name: REQUIRE_WRITE_CONFIRMATION
              value: {{ default "true" .Values.env.requireWriteConfirmation | quote }}
            - name: UPSTREAM_CONNECT_TIMEOUT
              value: {{ default "2500" .Values.env.upstreamConnectTimeout | quote }}
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9090
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
