{{- $secretObj := (lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" .Release.Name)) | default dict }}
{{- $secretData := (get $secretObj "data") | default dict }}
{{- $dbUser := .Values.auth.username | default "uai" }}
{{- $dbName := .Values.auth.database | default "uai_gateway" }}
{{- $dbPassword := "" }}
{{- if .Values.auth.password }}
  {{- $dbPassword = .Values.auth.password }}
{{- else if hasKey $secretData "password" }}
  {{- $dbPassword = (index $secretData "password" | b64dec) }}
{{- else }}
  {{- $dbPassword = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  database: {{ $dbName | b64enc | quote }}
  username: {{ $dbUser | b64enc | quote }}
  password: {{ $dbPassword | b64enc | quote }}
  db-url: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" $dbUser $dbPassword .Release.Name $dbName | b64enc | quote }}
