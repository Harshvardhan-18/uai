apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  database: {{ .Values.auth.database | quote }}
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  db-url: "postgres://{{ .Values.auth.username }}:{{ .Values.auth.password }}@{{ .Release.Name }}-postgres:5432/{{ .Values.auth.database }}"
