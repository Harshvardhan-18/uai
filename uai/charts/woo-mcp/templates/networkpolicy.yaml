{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-woo-mcp
  labels:
    app.kubernetes.io/name: woo-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from gateway pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8000
    # Allow traffic from test/inspector pods and kubelet
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-inspector
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
