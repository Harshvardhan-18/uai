# Production overrides (k3s + Traefik on VPS)
# Usage: helm install uai ./uai -f ./uai/values-prod.yaml -n uai --create-namespace

ingress:
  className: traefik
  storeDomain: store.example.com   # Replace with real domain
  appDomain: app.example.com       # Replace with real domain
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - store.example.com
      secretName: store-tls
    - hosts:
        - app.example.com
      secretName: app-tls

gateway:
  env:
    llmProvider: "groq"
    llmModel: "openai/gpt-oss-120b"
    healthCheckIntervalMs: 10000
    requireWriteConfirmation: true
    upstreamConnectTimeout: 2500

woocommerce:
  site:
    scheme: "https"
    url: "https://store.example.com"
    timezone: "Asia/Kolkata"


