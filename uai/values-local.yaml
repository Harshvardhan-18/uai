# Local development overrides (kind + ingress-nginx)
# Usage: helm install uai ./uai -f ./uai/values-local.yaml -n uai --create-namespace

ingress:
  className: nginx
  storeDomain: store.localtest.me
  appDomain: app.localtest.me

gateway:
  env:
    llmProvider: "groq"
    llmModel: "openai/gpt-oss-120b"
    healthCheckIntervalMs: 10000

