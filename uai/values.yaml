# UAI Platform — Default values
# Override with values-local.yaml or values-prod.yaml

ingress:
  enabled: true
  className: nginx
  storeDomain: store.localtest.me
  appDomain: app.localtest.me
  annotations: {}

# ── Subchart toggles ──
mariadb:
  enabled: true

woocommerce:
  enabled: true
  site:
    scheme: "http"
    url: "http://store.localtest.me"
    timezone: "UTC"

postgres:
  enabled: true

woo-mcp:
  enabled: true

gateway:
  enabled: true
  env:
    llmProvider: "groq"
    llmModel: "openai/gpt-oss-120b"
    healthCheckIntervalMs: 10000
    requireWriteConfirmation: true
    upstreamConnectTimeout: 2500


dashboard:
  enabled: true

demo-mcp-servers:
  enabled: true

networkPolicies:
  enabled: true

